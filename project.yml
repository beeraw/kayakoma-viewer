name: KayakomaViewer
options:
  bundleIdPrefix: app.kayakoma
  deploymentTarget:
    macOS: "14.0"
  developmentLanguage: fr
  createIntermediateGroups: true

# The engine comes from GitHub. For local engine development, see
# "Developing with a local KayakomaKit" in the README.
packages:
  KayakomaKit:
    url: https://github.com/beeraw/kayakoma-kit.git
    from: 1.0.1

settings:
  base:
    MARKETING_VERSION: 1.0.0
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "6.0"
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    # Ad hoc signatures carry no team ID, and the hardened runtime's library
    # validation then refuses the embedded KayakomaShared framework. Turn it
    # back on when signing with a Developer ID team (needed to notarize).
    ENABLE_HARDENED_RUNTIME: NO

targets:
  Viewer:
    type: application
    platform: macOS
    sources: [Viewer, Shared]
    dependencies:
      - target: KayakomaShared
        embed: true
      - target: QuickLook
        embed: true
    # Writes Translations/*.xliff into the string catalog before it is
    # compiled. The script sandbox only lets it read the files it declares:
    # the XLIFF files come from Translations/Translations.xcfilelist, which
    # the script keeps up to date. It runs only when one of them changed, and
    # only rewrites the catalog when a translation changed.
    preBuildScripts:
      - name: Import Translations
        script: |
          /usr/bin/python3 -B "$SRCROOT/scripts/translations.py" import --catalog "$SRCROOT/Viewer/Localizable.xcstrings" --translations "$SRCROOT/Translations"
        inputFiles:
          - $(SRCROOT)/scripts/translations.py
        inputFileLists:
          - $(SRCROOT)/Translations/Translations.xcfilelist
        outputFiles:
          - $(SRCROOT)/Viewer/Localizable.xcstrings
    settings:
      base:
        ENABLE_USER_SCRIPT_SANDBOXING: YES
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../Frameworks"]
        PRODUCT_NAME: Kayakoma Viewer
        PRODUCT_BUNDLE_IDENTIFIER: app.kayakoma.viewer
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        SWIFT_EMIT_LOC_STRINGS: YES
        LOCALIZATION_PREFERS_STRING_CATALOGS: YES
    entitlements:
      path: Viewer/Viewer.entitlements
      properties:
        com.apple.security.app-sandbox: true
        # Read-write so that the save panel can write exported PDFs.
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.temporary-exception.files.absolute-path.read-only: ["/"]
    info:
      path: Viewer/Info.plist
      properties:
        CFBundleDisplayName: Kayakoma Viewer
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        CFBundleDocumentTypes:
          - CFBundleTypeName: Markdown
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [net.daringfireball.markdown]
          - CFBundleTypeName: Plain Text
            CFBundleTypeRole: Viewer
            LSHandlerRank: Alternate
            LSItemContentTypes: [public.plain-text]
        UTImportedTypeDeclarations:
          - UTTypeIdentifier: net.daringfireball.markdown
            UTTypeDescription: Markdown
            UTTypeConformsTo: [public.plain-text]
            UTTypeTagSpecification:
              public.filename-extension: [md, markdown, mdown, mkd]
              public.mime-type: [text/markdown]

  # The engine, linked once and shared by the app and the Quick Look extension.
  KayakomaShared:
    type: framework
    platform: macOS
    sources: [KayakomaShared]
    dependencies:
      - package: KayakomaKit
    settings:
      base:
        PRODUCT_NAME: KayakomaShared
        PRODUCT_BUNDLE_IDENTIFIER: app.kayakoma.viewer.shared
        GENERATE_INFOPLIST_FILE: YES
        MACH_O_TYPE: mh_dylib
        DEFINES_MODULE: YES
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@loader_path/Frameworks"]
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        # Tree-sitter generated parsers carry large symbol tables.
        DEAD_CODE_STRIPPING: YES

  QuickLook:
    type: app-extension
    platform: macOS
    sources: [QuickLook, Shared]
    dependencies:
      # Linked, not embedded: the app embeds the framework once.
      - target: KayakomaShared
        embed: false
      - sdk: Quartz.framework
    settings:
      base:
        LD_RUNPATH_SEARCH_PATHS: ["$(inherited)", "@executable_path/../../../../Frameworks"]
        PRODUCT_NAME: KayakomaQuickLook
        PRODUCT_BUNDLE_IDENTIFIER: app.kayakoma.viewer.quicklook
    entitlements:
      path: QuickLook/QuickLook.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.temporary-exception.files.absolute-path.read-only: ["/"]
    info:
      path: QuickLook/Info.plist
      properties:
        CFBundleDisplayName: Kayakoma
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.quicklook.preview
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PreviewViewController
          NSExtensionAttributes:
            QLSupportedContentTypes: [net.daringfireball.markdown]
            QLSupportsSearchableItems: false

  # Unhosted: the tests compile the app's sources and never launch the app.
  ViewerTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: Viewer
        excludes:
          - ViewerApp.swift
          - Info.plist
          - Viewer.entitlements
          - AppIcon.icon
          - Assets.xcassets
          - Localizable.xcstrings
          - Credits.rtf
      - Shared
      - ViewerTests
    dependencies:
      - package: KayakomaKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.kayakoma.viewer.tests

schemes:
  Viewer:
    build:
      targets:
        Viewer: all
      # Same import as the build phase, run outside the script sandbox before
      # Xcode plans the build: a newly added XLIFF file joins the file list
      # and its language ships from the first build.
      preActions:
        - name: Import Translations
          settingsTarget: Viewer
          script: |
            /usr/bin/python3 -B "$SRCROOT/scripts/translations.py" import --catalog "$SRCROOT/Viewer/Localizable.xcstrings" --translations "$SRCROOT/Translations"
    test:
      targets: [ViewerTests]
